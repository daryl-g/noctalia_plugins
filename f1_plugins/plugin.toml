id           = "darylg/f1-plugins"
name         = "F1 Info & Results"
version      = "1.0.0"
plugin_api   = 32
author       = "darylg"
license      = "MIT"
deprecated   = false
icon         = "puzzle"
description  = "Display F1 team and driver information, and latest race results."
tags         = ["panel", "desktop", "fun", "hyprland", "arch"]

[[setting]]
key             = "favourite_team"
type            = "select"
label_key       = "settings.favourite_team.label"
description_key = "settings.favourite_team.description"
default         = "audi"
options = [
    { value = "alpine", label_key = "settings.favourite_team.options.alpine" },
    { value = "aston-martin", label_key = "settings.favourite_team.options.aston-martin" },
    { value = "audi", label_key = "settings.favourite_team.options.audi" },
    { value = "cadillac", label_key = "settings.favourite_team.options.cadillac" },
    { value = "ferrari", label_key = "settings.favourite_team.options.ferrari" },
    { value = "haas", label_key = "settings.favourite_team.options.haas" },
    { value = "mclaren", label_key = "settings.favourite_team.options.mclaren" },
    { value = "mercedes", label_key = "settings.favourite_team.options.mercedes" },
    { value = "racing-bulls", label_key = "settings.favourite_team.options.racing-bulls" },
    { value = "red-bull", label_key = "settings.favourite_team.options.red-bull" },
    { value = "williams", label_key = "settings.favourite_team.options.williams" },
]

[[setting]]
key             = "favourite_driver"
type            = "select"
label_key       = "settings.favourite_driver.label"
description_key = "settings.favourite_driver.description"
default         = "nico_hulkenberg"
options = [
    { value = "alexander-albon", label_key = "settings.favourite_driver.options.alexander-albon" },
    { value = "fernando-alonso", label_key = "settings.favourite_driver.options.fernando-alonso" },
    { value = "kimi-antonelli", label_key = "settings.favourite_driver.options.kimi-antonelli" },
    { value = "oliver-bearman", label_key = "settings.favourite_driver.options.oliver-bearman" },
    { value = "gabriel-bortoleto", label_key = "settings.favourite_driver.options.gabriel-bortoleto" },
    { value = "valtteri-bottas", label_key = "settings.favourite_driver.options.valtteri-bottas" },
    { value = "franco-colapinto", label_key = "settings.favourite_driver.options.franco-colapinto" },
    { value = "pierre-gasly", label_key = "settings.favourite_driver.options.pierre-gasly" },
    { value = "isack-hadjar", label_key = "settings.favourite_driver.options.isack-hadjar" },
    { value = "lewis-hamilton", label_key = "settings.favourite_driver.options.lewis-hamilton" },
    { value = "nico-hulkenberg", label_key = "settings.favourite_driver.options.nico-hulkenberg" },
    { value = "liam-lawson", label_key = "settings.favourite_driver.options.liam-lawson" },
    { value = "charles-leclerc", label_key = "settings.favourite_driver.options.charles-leclerc" },
    { value = "arvid-lindblad", label_key = "settings.favourite_driver.options.arvid-lindblad" },
    { value = "lando-norris", label_key = "settings.favourite_driver.options.lando-norris" },
    { value = "esteban-ocon", label_key = "settings.favourite_driver.options.esteban-ocon" },
    { value = "sergio-perez", label_key = "settings.favourite_driver.options.sergio-perez" },
    { value = "oscar-piastri", label_key = "settings.favourite_driver.options.oscar-piastri" },
    { value = "george-russell", label_key = "settings.favourite_driver.options.george-russell" },
    { value = "carlos-sainz", label_key = "settings.favourite_driver.options.carlos-sainz" },
    { value = "lance-stroll", label_key = "settings.favourite_driver.options.lance-stroll" },
    { value = "yuki-tsunoda", label_key = "settings.favourite_driver.options.yuki-tsunoda" },
    { value = "max-verstappen", label_key = "settings.favourite_driver.options.max-verstappen" },
]

[[desktop_widget]]
id = "team"

[[service]]
id    = "service"
entry = "service.luau"